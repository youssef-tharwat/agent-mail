[package]
name = "agent-mail"
version = "0.12.0"
edition = "2024"
rust-version = "1.85"
description = "Durable tasks and messages for coding agents"
repository = "https://github.com/youssef-tharwat/agent-mail"
authors = ["Youssef Tharwat"]
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
sha2 = "0.10"
zstd = "0.13"
mimalloc = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "signal", "process", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }

[build-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
