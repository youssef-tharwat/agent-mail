id = "youssef-tharwat.agent-mail"
name = "Agent Mail"
version = "0.10.1"
min_herdr_version = "0.9.1"
description = "Local durable tasks and messages for coding agents"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/install.sh", "--plugin"]

[[startup]]
platforms = ["macos"]
command = ["./target/release/agent-mail", "adapter", "restore"]

[[actions]]
id = "setup"
title = "Set up Mail"
contexts = ["workspace"]
platforms = ["macos"]
command = ["./target/release/agent-mail", "init", "default"]

[[actions]]
id = "setup-linux"
title = "Set up Mail state"
contexts = ["workspace"]
platforms = ["linux"]
command = ["./target/release/agent-mail", "init", "default"]

[[actions]]
id = "status"
title = "Mail status"
contexts = ["workspace"]
command = ["./target/release/agent-mail", "status", "--all-groups"]

[[actions]]
id = "connect-herdr"
title = "Connect this Herdr workspace"
contexts = ["workspace"]
command = ["./target/release/agent-mail", "runtime", "herdr"]

[[actions]]
id = "install-service"
title = "Install background worker"
contexts = ["workspace"]
platforms = ["macos"]
command = ["./target/release/agent-mail", "service", "install"]
